name: Build Darkwave+CD (Windows x64)

on:
  push:
    branches: [compact-dark-from-plus]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Generate Windows icon
        run: |
          python -m pip install Pillow
          python tools/create_icon.py
      - name: Restore actual DARKWAVE+ project
        run: dotnet restore NEONWAVE/NEONWAVE.csproj
      - name: Publish Darkwave+CD Windows x64
        run: dotnet publish NEONWAVE/NEONWAVE.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish
      - name: Upload Darkwave+CD executable
        uses: actions/upload-artifact@v4
        with:
          name: Darkwave+CD-Windows-x64
          path: publish/Darkwave+CD.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish Darkwave+CD v1.0.4 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="darkwave-plus-cd-v1.0.4"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Updating $tag with the executable from this final build."
            gh release upload "$tag" "publish/Darkwave+CD.exe" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "publish/Darkwave+CD.exe" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Darkwave+CD v1.0.4 — Windows x64" \
              --notes "Fixes clipping of the volume percentage screen and DIM/MUTE controls at the player minimum window width by reclaiming horizontal space in the playback pane. Preserves the SET/DIM choices, source selectors, media keys, and previous fixes. Standalone Windows x64 executable."
          fi
