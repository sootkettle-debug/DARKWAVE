name: Build Compact Dark preview (Windows x64)

on:
  push:
    branches:
      - compact-dark-redesign
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: windows-latest
    steps:
      - name: Check out Compact Dark branch
        uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Generate application icon
        shell: pwsh
        run: |
          python -m pip install Pillow
          python tools/create_icon.py
      - name: Restore WPF player
        run: dotnet restore NEONWAVE/NEONWAVE.csproj
      - name: Build standalone Windows x64 preview
        run: dotnet publish NEONWAVE/NEONWAVE.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:AssemblyName=CompactDarkPreview -o publish
      - name: Package preview
        shell: pwsh
        run: Compress-Archive -Path publish/CompactDarkPreview.exe -DestinationPath Compact-Dark-Preview-Windows-x64.zip
      - name: Upload preview executable
        uses: actions/upload-artifact@v4
        with:
          name: Compact-Dark-Preview-Windows-x64
          path: Compact-Dark-Preview-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
